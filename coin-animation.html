<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coin Animation</title>

<!--
  ============================================================================
  COIN ANIMATION — single-file, no external requests
  ----------------------------------------------------------------------------
  A cluster of dark metallic coins (star emblem) hangs on a black field and
  drifts/rotates gently in place — a subtle ambient loop, not a story.
  Pure CSS 3D transforms + CSS keyframes; no JS animation loop needed.
  ============================================================================
-->

<style>
  :root{ --bg:#000; }

  *{ box-sizing:border-box; }

  html, body{
    margin:0;
    width:100%;
    height:100%;
    background:var(--bg);
    overflow:hidden;
  }

  .stage{
    position:relative;
    width:100vw;
    height:100vh;
    background: radial-gradient(ellipse at 50% 45%, #0c0c0d 0%, #000 65%);
    perspective:1400px;
    overflow:hidden;
  }

  /* ---------------------------------------------------------------------
     Each coin = an outer wrapper that floats (slow position drift) and an
     inner disc that rotates (slow rotateY oscillation). Separate elements
     so the two animations never fight over the same `transform` property.
  --------------------------------------------------------------------- */
  .float{
    position:absolute;
    transform-style:preserve-3d;
    animation: floaty var(--float-dur) ease-in-out var(--float-delay) infinite;
    filter:blur(var(--blur));
  }

  .coin{
    position:relative;
    width:100%;
    height:100%;
    transform-style:preserve-3d;
    animation: spin var(--spin-dur) ease-in-out var(--spin-delay) infinite;
    filter: drop-shadow(0 14px 26px rgba(0,0,0,.65));
  }

  .coin__face{
    position:absolute;
    inset:0;
    border-radius:50%;
    backface-visibility:hidden;
    background:
      radial-gradient(circle at 30% 24%, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 26%),
      radial-gradient(circle, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 67%, #b4b4ba 75%, #f3f3f7 82%, #828288 89%, #141416 95%, #020203 100%),
      #060607;
    box-shadow:
      inset 0 0 0 1.5% rgba(0,0,0,.85),
      inset 0 8% 18% rgba(0,0,0,.55);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .coin__face--back{ transform:rotateY(180deg); }

  .coin__face svg{
    width:48%;
    height:48%;
    filter:drop-shadow(0 1.5px 1.5px rgba(0,0,0,.7));
  }

  .coin__edge{
    position:absolute;
    left:50%;
    top:3%;
    bottom:3%;
    width:5%;
    transform:translateX(-50%);
    border-radius:50%;
    background:linear-gradient(90deg,
      rgba(255,255,255,0) 0%,
      rgba(225,225,230,.85) 48%,
      rgba(255,255,255,0) 100%);
    opacity:var(--edge-op);
    pointer-events:none;
  }

  @keyframes floaty{
    0%   { transform:translate3d(0, 0, 0); }
    25%  { transform:translate3d(var(--dx),  calc(var(--dy) * -1), 0); }
    50%  { transform:translate3d(calc(var(--dx) * -0.5), var(--dy), 0); }
    75%  { transform:translate3d(calc(var(--dx) * 0.6), calc(var(--dy) * -0.65), 0); }
    100% { transform:translate3d(0, 0, 0); }
  }

  @keyframes spin{
    0%   { transform: rotateY(calc(var(--base-y) - var(--amp))) rotateZ(var(--tilt)); }
    50%  { transform: rotateY(calc(var(--base-y) + var(--amp))) rotateZ(var(--tilt)); }
    100% { transform: rotateY(calc(var(--base-y) - var(--amp))) rotateZ(var(--tilt)); }
  }
</style>
</head>
<body>

<div class="stage" id="stage"></div>

<!-- reusable logo, defined once -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#c9c9ce"/>
      <stop offset="45%" stop-color="#86868d"/>
      <stop offset="100%" stop-color="#4d4d52"/>
    </linearGradient>
    <g id="star-mark" fill="url(#markGrad)">
      <path d="M44,4 L54,45 L88,50 L55,55 L50,88 L45,55 L12,50 L45,45 Z
               M48,20 L50,27 L63,22 Z"/>
    </g>
  </defs>
</svg>

<script>
(function(){
  "use strict";

  var stage = document.getElementById('stage');

  // Hand-placed to echo the reference cluster: a few large coins, a
  // scatter of smaller ones, and one near edge-on sliver lower-left.
  var coins = [
    { x:24, y:20, size:14.5, baseY:  8, amp:16, blur:0,   op:1.00 },
    { x:58, y:11, size: 6.5, baseY: 30, amp:20, blur:1.0, op:0.85 },
    { x:66, y:36, size:10.5, baseY: 18, amp:18, blur:0.4, op:0.95 },
    { x:73, y:58, size:13.0, baseY: 50, amp:16, blur:0,   op:1.00 },
    { x:62, y:69, size: 7.5, baseY: 12, amp:20, blur:0.8, op:0.90 },
    { x:23, y:74, size:15.0, baseY: 84, amp: 6, blur:0,   op:1.00 },
    { x:42, y:87, size:12.0, baseY: 38, amp:18, blur:0.3, op:0.95 },
    { x:35, y:95, size: 7.0, baseY: 52, amp:18, blur:1.2, op:0.80 }
  ];

  coins.forEach(function(c, i){
    var wrap = document.createElement('div');
    wrap.className = 'float';

    var sizePx = 'clamp(' + Math.round(c.size * 6) + 'px, ' + c.size + 'vw, ' + Math.round(c.size * 16) + 'px)';
    wrap.style.left   = c.x + '%';
    wrap.style.top    = c.y + '%';
    wrap.style.width  = sizePx;
    wrap.style.height = sizePx;
    wrap.style.marginLeft = 'calc(' + sizePx + ' / -2)';
    wrap.style.marginTop  = 'calc(' + sizePx + ' / -2)';
    wrap.style.setProperty('--blur', c.blur + 'px');
    wrap.style.opacity = c.op;

    var dx = (6 + Math.random() * 10).toFixed(1) + 'px';
    var dy = (8 + Math.random() * 14).toFixed(1) + 'px';
    var floatDur = (7 + Math.random() * 6).toFixed(1) + 's';
    var floatDelay = (-Math.random() * 12).toFixed(1) + 's';
    wrap.style.setProperty('--dx', dx);
    wrap.style.setProperty('--dy', dy);
    wrap.style.setProperty('--float-dur', floatDur);
    wrap.style.setProperty('--float-delay', floatDelay);

    var coin = document.createElement('div');
    coin.className = 'coin';
    var spinDur = (8 + Math.random() * 7).toFixed(1) + 's';
    var spinDelay = (-Math.random() * 14).toFixed(1) + 's';
    var tilt = (Math.random() * 16 - 8).toFixed(1) + 'deg';
    coin.style.setProperty('--base-y', c.baseY + 'deg');
    coin.style.setProperty('--amp', c.amp + 'deg');
    coin.style.setProperty('--spin-dur', spinDur);
    coin.style.setProperty('--spin-delay', spinDelay);
    coin.style.setProperty('--tilt', tilt);

    var edgeOp = Math.min(1, Math.abs(Math.sin(c.baseY * Math.PI / 180)) * 0.9 + 0.1);
    coin.style.setProperty('--edge-op', edgeOp.toFixed(2));

    coin.innerHTML =
      '<div class="coin__face coin__face--front">' +
        '<svg viewBox="0 0 100 100"><use href="#star-mark"></use></svg>' +
      '</div>' +
      '<div class="coin__edge"></div>' +
      '<div class="coin__face coin__face--back">' +
        '<svg viewBox="0 0 100 100"><use href="#star-mark"></use></svg>' +
      '</div>';

    wrap.appendChild(coin);
    stage.appendChild(wrap);
  });
})();
</script>

</body>
</html>
